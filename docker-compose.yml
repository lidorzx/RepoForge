services:
  repoforge:
    build: .
    container_name: repoforge
    ports:
      - "8000:8000"
    environment:
      REPOFORGE_HOST_WORKDIR: ${PWD}/workdir
      REPOFORGE_OUTPUT_UID: ${REPOFORGE_OUTPUT_UID:-1000}
      REPOFORGE_OUTPUT_GID: ${REPOFORGE_OUTPUT_GID:-1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}/bundles:/app/bundles
      - ${PWD}/workdir:/app/workdir
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
