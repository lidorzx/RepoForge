<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <!-- Drop shadow -->
  <ellipse cx="50" cy="116" rx="28" ry="4" fill="#00000033"/>

  <!-- Feet -->
  <ellipse cx="34" cy="108" rx="14" ry="6" fill="#f5a800" transform="rotate(-10 34 108)"/>
  <ellipse cx="66" cy="108" rx="14" ry="6" fill="#f5a800" transform="rotate(10 66 108)"/>
  <!-- Toe details left -->
  <ellipse cx="22" cy="109" rx="5" ry="3.5" fill="#f5a800" transform="rotate(-10 22 109)"/>
  <ellipse cx="29" cy="112" rx="5" ry="3.5" fill="#f5a800" transform="rotate(-10 29 112)"/>
  <ellipse cx="38" cy="112" rx="5" ry="3.5" fill="#f5a800" transform="rotate(-10 38 112)"/>
  <!-- Toe details right -->
  <ellipse cx="78" cy="109" rx="5" ry="3.5" fill="#f5a800" transform="rotate(10 78 109)"/>
  <ellipse cx="71" cy="112" rx="5" ry="3.5" fill="#f5a800" transform="rotate(10 71 112)"/>
  <ellipse cx="62" cy="112" rx="5" ry="3.5" fill="#f5a800" transform="rotate(10 62 112)"/>

  <!-- Body (black) -->
  <ellipse cx="50" cy="82" rx="32" ry="34" fill="#1a1a1a"/>

  <!-- Left wing -->
  <path d="M18 68 C4 74 2 95 8 108 C16 112 28 106 28 100 C22 88 18 78 20 68Z" fill="#1a1a1a"/>
  <!-- Right wing -->
  <path d="M82 68 C96 74 98 95 92 108 C84 112 72 106 72 100 C78 88 82 78 80 68Z" fill="#1a1a1a"/>

  <!-- Belly (cream/white) -->
  <ellipse cx="50" cy="88" rx="20" ry="22" fill="#f5f0d0"/>

  <!-- Neck -->
  <ellipse cx="50" cy="52" rx="19" ry="8" fill="#1a1a1a"/>

  <!-- Head (black) -->
  <ellipse cx="50" cy="34" rx="27" ry="28" fill="#1a1a1a"/>

  <!-- Face white -->
  <ellipse cx="50" cy="39" rx="18" ry="18" fill="#f5f0d0"/>

  <!-- Left eye white -->
  <ellipse cx="38" cy="30" rx="9" ry="10" fill="white"/>
  <!-- Right eye white -->
  <ellipse cx="62" cy="30" rx="9" ry="10" fill="white"/>

  <!-- Left pupil -->
  <ellipse cx="41" cy="32" rx="5.5" ry="6" fill="#111"/>
  <!-- Right pupil -->
  <ellipse cx="65" cy="32" rx="5.5" ry="6" fill="#111"/>

  <!-- Eye shine left -->
  <circle cx="38" cy="28" r="2" fill="white"/>
  <!-- Eye shine right -->
  <circle cx="62" cy="28" r="2" fill="white"/>

  <!-- Beak -->
  <path d="M42 46 C46 40 54 40 58 46 C54 54 46 54 42 46Z" fill="#f5a800"/>
  <path d="M44 50 C47 56 53 56 56 50" stroke="#d48000" stroke-width="1" fill="none"/>
</svg>
